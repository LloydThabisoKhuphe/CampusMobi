<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>campusMobi</title>

  <!--
    Plain JavaScript, no build step: js/app.js is loaded as a native ES
    module (type="module"), so the browser itself resolves every
    import/export between files — no Babel, no bundler, no npm install
    needed for the frontend. See README.md for how it all fits together.
  -->

  <!-- Styles: base.css first (design tokens), then one file per component/page -->
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/navbar.css" />
  <link rel="stylesheet" href="css/mini-calendar.css" />
  <link rel="stylesheet" href="css/campus-map.css" />
  <link rel="stylesheet" href="css/login-page.css" />
  <link rel="stylesheet" href="css/dashboard-page.css" />
  <link rel="stylesheet" href="css/services-page.css" />
  <link rel="stylesheet" href="css/card-page.css" />
  <link rel="stylesheet" href="css/wallet-page.css" />
  <link rel="stylesheet" href="css/calendar-page.css" />
  <link rel="stylesheet" href="css/map-page.css" />
  <link rel="stylesheet" href="css/notifications-page.css" />
</head>
<body>
  <div id="app"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
